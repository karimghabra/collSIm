# The campaign's environment (conda-forge). Exact builds with checksums:
# environment.lock.txt (micromamba create -n md --file aamd/environment.lock.txt).
name: md
channels: [conda-forge]
dependencies:
  - python=3.11.18
  - openmm=8.6.1          # CUDA platform; cuda-version 12.9 runtime
  - cuda-version=12.9
  - ambertools=26.0       # tleap, parmchk2, ff14SB, ff14SB_modAA, Li-Merz ions, lj_1264_pol.dat
  - parmed=4.3.1          # add12_6_4 (reference for the r^-4 term in tests)
  - psi4=1.11             # HF/6-31G* electrostatic potentials for RESP
  - pymbar-core=4.2.0     # MBAR
  - mdtraj=1.11.1
  - numpy=2.4.6
  - scipy=1.17.1
  - matplotlib-base
  - numba=0.68.1          # modcoll.ions kernels
  - pdbfixer
  - pytest
